# Makerdiary nRF52840 MDK USB Dongle: sicher unabhaengig von der Bestueckung.
# Interner RC-Oszillator statt 32-kHz-Quarz und Spannungsregler im LDO-Modus
# (DCDC braucht eine Spule auf der Platine). Am USB-Anschluss spielt der etwas
# hoehere Stromverbrauch keine Rolle.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BOARD_ENABLE_DCDC=n
